# Local PostgreSQL for development and tests: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: framework
      POSTGRES_PASSWORD: framework
      POSTGRES_DB: framework_dev
    ports:
      - "5432:5432"
    volumes:
      - framework-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framework -d framework_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  framework-postgres:
